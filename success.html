<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poruka Poslana | Haris Milavica</title>
    <link rel="stylesheet" href="style.css"> <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .success-container {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-top: 5px solid #800000; /* Maroon boja */
        }
        .success-container i {
            font-size: 50px;
            color: #800000;
            margin-bottom: 20px;
        }
        .success-container h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .success-container p {
            color: #666;
            margin-bottom: 25px;
        }
        .btn-back {
            display: inline-block;
            padding: 10px 25px;
            background-color: #800000;
            color: #E5E4E2; /* Platinum */
            text-decoration: none;
            border-radius: 5px;
            transition: 0.3s;
        }
        .btn-back:hover {
            background-color: #a00000;
        }
    </style>
</head>
<body>

    <div class="success-container">
        <i class="fas fa-paper-plane"></i>
        <h1>Hvala vam!</h1>
        <p>Vaša poruka je uspješno poslana. Odgovoriću vam u najkraćem mogućem roku.</p>
        <a href="index.html" class="btn-back">Nazad na početnu</a>
    </div>

</body>
</html>
